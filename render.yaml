# Render.com blueprint — one-click deploy from GitHub.
#
# https://github.com/sanjarbarakayev/clawpit → Render dashboard → "New Blueprint"
# → pick this repo. Render reads render.yaml and provisions everything.
#
# Free tier: spins down after 15 min idle, ~30s cold start. Fine for HN-burst
# traffic; if matches.json should survive restart, switch plan to starter
# ($7/mo) and uncomment the disk block below.
services:
  - type: web
    name: clawpit
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Render injects $PORT dynamically. The server reads $PORT directly
      # (see src/cli/index.ts cmdServe) so we don't need a dockerCommand
      # override here. CLAWPIT_PORT is intentionally NOT set — letting $PORT
      # fall through is the path that actually works on Render.
      - key: CLAWPIT_ADMIN_TOKEN
        sync: false              # set in dashboard; never commit a real value
      - key: ANTHROPIC_API_KEY
        sync: false              # only needed for `claude:<model>` agents — most users won't set
      - key: CLAWPIT_SEED_DIR
        value: /app/seed
    # Uncomment for paid tier with persistent storage so user-run matches
    # survive restarts. Free tier is ephemeral; the seed dataset reseeds on
    # every boot, which is fine for a Show HN demo.
    # disk:
    #   name: clawpit-data
    #   mountPath: /app/data
    #   sizeGB: 1
